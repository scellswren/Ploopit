<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--U:#4bc22e;--R:#0a8fe0;--E:#d33a2c;--L:#ff9a00;--C:#00c8e8;--pur:#9b49ae;--pur2:#7a2e92;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;font-weight:900;color:#fff;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 70px,transparent 70px 140px),linear-gradient(180deg,#12c4dc,#3b8fe2) fixed;overflow-x:hidden}
.t{font-family:'Titan One',Impact,sans-serif;font-weight:400}
button{font-family:inherit}
:focus-visible{outline:4px solid #fff;outline-offset:3px}
.top{position:absolute;top:env(safe-area-inset-top,0px);right:0;display:grid;gap:8px;justify-items:end;z-index:2}
.chip{background:var(--pur);border:0;color:#fff;border-radius:0 0 0 14px;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 #6a2b98;font:700 20px Nunito;cursor:default}
button.chip{cursor:pointer}.chip.s{border-radius:14px 0 0 14px}
.av{width:34px;height:34px;border-radius:8px;background:#5bc0f0;overflow:hidden;display:grid;place-items:center;font:400 18px 'Titan One'}
.coin{display:inline-block;width:22px;height:22px;border-radius:5px;background:#ffc21a;border:3px solid #e39a00;transform:rotate(12deg);position:relative;flex:none}
.coin:after{content:"B";position:absolute;inset:0;font:900 11px/16px Nunito;color:#a56b00;text-align:center}
.wrap{max-width:1300px;margin:auto;padding:24px 28px 50px}
.head{display:flex;flex-wrap:wrap;align-items:end;gap:14px 24px;margin:0 0 22px}
h1{margin:0;font:400 64px/1 'Titan One';text-shadow:0 4px 0 rgba(0,40,90,.35)}
.pill{font:900 17px Nunito;border:0;border-radius:12px;padding:10px 16px;background:var(--pur);color:#fff;cursor:pointer;box-shadow:0 4px 0 #6a2b98;display:inline-flex;gap:10px;align-items:center}
.pill:active{transform:translateY(3px)}
nav{display:flex;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.ck{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:16px}
.pill[aria-pressed=true] .ck{background:#fff;color:var(--pur2)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:26px 22px}
.card{display:block;width:100%;padding:4px;border:0;border-radius:20px;background:var(--rim);cursor:pointer;box-shadow:0 7px 0 rgba(0,35,90,.38),inset 0 0 0 3px rgba(255,255,255,.18);transition:transform .15s;color:#fff}
.card:hover{transform:translateY(-4px) scale(1.02)}
.art{aspect-ratio:1/1.02;border-radius:15px 15px 0 0;background:var(--bg);overflow:hidden;display:grid;place-items:center}
.price{border-top:4px solid #fff;border-radius:0 0 15px 15px;background:linear-gradient(#4a9af2,#2f84ea);height:58px;display:flex;justify-content:center;align-items:center;gap:10px;font:400 28px 'Titan One';text-shadow:0 3px 0 rgba(0,30,110,.45)}
.pi{display:grid;place-items:center;width:100%;height:100%}.pi img{width:88%;height:88%;object-fit:contain;display:block;transform:rotate(7deg);filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.art,.pf{position:relative}
.pic{position:absolute;right:3%;bottom:3%;width:22%;height:22%;opacity:.35;filter:brightness(0) invert(1);pointer-events:none}.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pi.nf::after{display:block;transform:rotate(7deg);content:attr(data-l);font:400 26px/1 'Titan One';text-align:center;padding:10px;text-shadow:0 3px 0 rgba(0,0,0,.4);text-transform:uppercase}
.bi{display:grid;place-items:center;width:100%;height:100%;border-radius:14px}.bi img{width:100%;height:100%;object-fit:contain}
.bi.nf{background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 70%,#000));color:#fff}.bi.nf::after{content:attr(data-l);font:400 30px 'Titan One'}
.lk-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.lpanel{background:var(--pur);border-radius:16px;border:4px solid #8a3aa0;padding:18px 22px;height:calc(100vh - 250px);min-height:420px;overflow:auto;box-shadow:0 6px 0 rgba(60,10,90,.4);scrollbar-color:#fff #8a3aa0}
.lpanel h2{font:400 34px 'Titan One';margin:6px 0 0;padding-bottom:6px;border-bottom:4px solid #fff;text-shadow:0 3px 0 rgba(60,10,90,.35)}
.bl{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 28px}
.bt{position:relative;width:70px;height:70px;border:0;background:none;padding:0;cursor:pointer}
.bt:hover{transform:translateY(-3px)}
.bt .q{position:absolute;left:-3px;bottom:-3px;min-width:22px;height:22px;border-radius:11px;background:var(--c);border:2px solid #fff;color:#fff;font:900 12px/18px Nunito;text-align:center;padding:0 5px}
.bt.l{cursor:default}.bt.l:hover{transform:none}
.bt.l .lc{width:100%;height:100%;border-radius:14px;background:#000;display:grid;place-items:center}
.bt.sel{outline:4px solid #ffd23f;outline-offset:2px;border-radius:14px}
.side{background:var(--pur);border-radius:16px;border:4px solid #8a3aa0;padding:112px 18px 22px;position:relative;margin-top:96px;box-shadow:0 6px 0 rgba(60,10,90,.4)}
.star{position:absolute;left:50%;top:-100px;width:360px;transform:translateX(-50%)}
.gems{display:flex;flex-wrap:wrap;gap:16px 8px;justify-content:center}
.gems div{width:25%;text-align:center;font:900 22px Nunito}.gems svg{display:block;margin:0 auto 4px}
.sts{display:flex;justify-content:space-around;border-top:2px solid rgba(255,255,255,.25);margin-top:22px;padding-top:24px;text-align:center}
.sts b{display:block;font:400 38px 'Titan One'}.sts span{font:700 17px Nunito}
.sts .c2{display:flex;gap:6px;align-items:center;justify-content:center}
.note{opacity:.8;font:700 16px Nunito;margin:10px 0 24px}
#ov{position:fixed;inset:0;background:rgba(5,20,45,.8);display:none;place-items:center;z-index:10;padding:16px;overflow:auto}#ov.on{display:grid}
#stage{display:grid;gap:16px;justify-items:center;max-width:460px;width:100%;text-align:center;position:relative}
#stage.wide{max-width:880px}
.pm{display:grid;grid-template-columns:minmax(0,330px) 1fr;gap:28px;background:var(--pur);border-radius:20px;padding:26px;text-align:left;width:100%;position:relative;box-shadow:0 8px 0 rgba(60,10,90,.45)}
.pm.one{grid-template-columns:1fr}
.pf{aspect-ratio:1;border-radius:24px;border:7px solid rgba(255,255,255,.22);background:var(--bg);overflow:hidden;display:grid;place-items:center}
.pm h2{font:400 44px/1.02 'Titan One';margin:0 0 12px;padding-right:30px}
.x{position:absolute;top:10px;right:14px;border:0;background:none;color:rgba(255,255,255,.55);font:900 34px/1 Nunito;cursor:pointer}
.sb{font:900 15px Nunito;border:0;border-radius:10px;padding:8px 14px;background:rgba(255,255,255,.3);color:#fff;cursor:pointer}
.sb:disabled{opacity:.4;cursor:default}
.pchip{display:inline-flex;gap:8px;align-items:center;background:var(--pur2);border-radius:10px;padding:7px 14px;margin:12px 0 16px}
.qr{display:flex;gap:12px;align-items:center;margin:6px 0 14px;font:400 26px 'Titan One'}
.qr input{width:92px;font:400 30px 'Titan One';text-align:center;color:#fff;background:transparent;border:4px solid rgba(255,255,255,.5);border-radius:12px;padding:4px}
.qb{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.buy{width:100%;background:#3f51b5;box-shadow:0 5px 0 #28367e;border:0;border-radius:12px;color:#fff;font:400 30px 'Titan One';padding:12px;cursor:pointer;margin-top:8px;display:flex;justify-content:center;gap:10px;align-items:center}
.buy:disabled{opacity:.5;cursor:not-allowed}
.dr{background:rgba(0,0,0,.18);border-radius:12px;padding:10px;font:700 15px Nunito;max-height:210px;overflow:auto;margin:0 0 12px}
.dr div{display:flex;gap:8px;align-items:center;padding:3px 0}.dot{width:12px;height:12px;border-radius:50%;flex:none}.p{margin-left:auto}
.nm{font:700 16px Nunito;border:0;border-radius:12px;padding:12px 14px;width:100%;color:#1b2a41;background:#fff}
.sc{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 18px}
.big{width:230px;border:0;background:none;padding:0;cursor:pointer;color:#fff}.big .card{pointer-events:none}.big.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg) scale(1.1)}60%{transform:rotate(-6deg) scale(1.15)}80%{transform:rotate(6deg) scale(1.2)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11}#flash.go{animation:fl .6s ease-out}@keyframes fl{0%{opacity:1}100%{opacity:0}}
.reveal{width:260px;border-radius:24px;padding:18px 14px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 55%,#000));border:5px solid #fff;animation:pop .55s cubic-bezier(.2,1.6,.4,1) both,glow 1.6s ease-in-out .5s infinite alternate}
.reveal .im{width:170px;height:170px;margin:0 auto}.reveal h2{margin:8px 0 2px;font:400 28px 'Titan One'}.reveal .rn{font:400 20px 'Titan One'}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}@keyframes glow{to{box-shadow:0 0 50px 8px var(--c)}}
.cf{position:fixed;left:50%;top:45%;width:10px;height:14px;background:var(--c);border-radius:2px;pointer-events:none;z-index:12;animation:burst 1.3s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.new{color:#ffd23f;font:400 26px 'Titan One'}.sub{font-size:13px;opacity:.8}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:900 16px Nunito;border:0;border-radius:12px;padding:12px 18px;color:#fff;background:#f5a623;box-shadow:0 4px 0 rgba(0,0,0,.3);cursor:pointer}.btn.g{background:rgba(120,140,170,.6)}.btn.r{background:#e0453a}.btn:disabled{opacity:.5}
.sr{position:absolute;left:-9999px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.lk-wrap{grid-template-columns:1fr}.side{order:-1}.lpanel{height:60vh}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:18px 14px}h1{font-size:44px;margin-top:70px}.pm{grid-template-columns:1fr}.star{width:300px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.lpanel.wide{height:calc(100vh - 230px)}
.pf.rt{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--bg) 62%,#000),color-mix(in srgb,var(--bg) 32%,#000))}
.drl{width:100%;padding:14px 10px;text-align:center;font:900 19px/1.35 Nunito;overflow:auto;max-height:100%}
.drl h3{font:400 36px/1.1 'Titan One';margin:0 0 8px}
#stage.op{position:fixed;inset:0;max-width:none;width:auto;display:block;cursor:pointer;overflow:hidden;outline:0;text-align:center}
.op .grid2{position:absolute;inset:0;display:grid;gap:6px;background:var(--gap,#1f0624);transition:background .5s}
.op .tl{border-radius:12px;transition:background .4s}
.op .grid2.ch{animation:hue 4s linear infinite}@keyframes hue{to{filter:hue-rotate(360deg)}}
.op .corner2{position:absolute;right:1.5%;bottom:1.5%;width:min(8vw,70px);height:min(8vw,70px);opacity:.5;filter:brightness(0) invert(1);pointer-events:none}.op .corner2 img{width:100%;height:100%;object-fit:contain}
.op .bagbox{position:absolute;left:50%;top:50%;width:clamp(200px,24vw,380px);aspect-ratio:1;transform:translate(-50%,-50%);animation:bagin .5s .35s ease-out both}
@keyframes bagin{from{opacity:0}to{opacity:1}}
.op.shake .bagbox{animation:bshake .45s ease-in-out infinite}
@keyframes bshake{0%,100%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,-50%) rotate(3deg) scale(1.04)}}
.bgi{position:relative;display:block;width:100%;height:100%}.bgi img{width:100%;height:100%;object-fit:contain;display:block}.bgi b{display:none}
.bgi.nf{background:var(--bag);border-radius:3px;box-shadow:0 8px 18px rgba(0,0,0,.45);display:grid;place-items:center;height:88%;margin-top:6%}
.bgi.nf b{display:block;font:400 clamp(20px,3vw,36px)/1 'Titan One';color:#fff;text-transform:uppercase;text-align:center;text-shadow:-2px -2px 0 #1b1030,2px -2px 0 #1b1030,-2px 2px 0 #1b1030,2px 2px 0 #1b1030}
.bgi.nf::after{content:"";position:absolute;left:-2%;right:-2%;bottom:-5%;height:5%;background:linear-gradient(#eef0f3,#b9bec7);-webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.bgi .strip{position:absolute;left:-2%;right:-2%;top:-5%;height:6%;background:linear-gradient(#eef0f3,#b9bec7);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;transform-origin:100% 100%}
.bgi .glow{position:absolute;left:5%;right:5%;top:-14%;height:22%;background:radial-gradient(ellipse,#fff7c4,rgba(255,240,150,0) 70%);opacity:0}
.op.tear .strip{animation:strip .55s ease-in forwards}
@keyframes strip{0%{transform:none;opacity:1}35%{transform:translate(6%,-60%) rotate(8deg)}100%{transform:translate(45%,-300%) rotate(32deg);opacity:0}}
.op.tear .glow{animation:glw .55s ease-out forwards}@keyframes glw{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.op.tear .bagbox{animation:bout .75s ease-in .2s forwards}
@keyframes bout{0%{transform:translate(-50%,-50%) rotate(0)}30%{transform:translate(-50%,-48%) rotate(8deg)}100%{transform:translate(-30%,70%) rotate(16deg) scale(.85);opacity:0}}
.op .rays2{position:absolute;left:50%;top:50%;width:1400px;height:1400px;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,255,255,.2) 0 8deg,transparent 8deg 16deg);-webkit-mask:radial-gradient(circle,#000 5%,transparent 65%);mask:radial-gradient(circle,#000 5%,transparent 65%);opacity:0;pointer-events:none}
.op.show.rays .rays2{opacity:1;animation:spin 10s linear infinite}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.op .cardw{position:absolute;left:50%;top:50%;width:clamp(220px,30vw,470px);aspect-ratio:1;transform:translate(-50%,-50%) scale(0);opacity:0}
.op.show .cardw{animation:cpop .3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes cpop{from{transform:translate(-50%,-50%) scale(.3);opacity:1}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cd{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--pb) 70%,#000),color-mix(in srgb,var(--pb) 35%,#000));box-shadow:0 0 0 4px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.5)}
.cd .bi{position:absolute;left:21%;top:25%;width:58%;height:58%}
.cd .ct{position:absolute;top:3%;left:0;right:0}
.cn{font:400 clamp(24px,4.4vw,52px)/1 'Titan One';color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 4px 0 #000}
.cr{font:400 clamp(16px,2.8vw,32px)/1.1 'Titan One';filter:brightness(1.4);text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.cp{position:absolute;bottom:3%;left:0;right:0;font:900 clamp(16px,2.6vw,30px) Nunito;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.op canvas{position:absolute;inset:0;pointer-events:none}
.op .hint{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);font:400 24px 'Titan One';opacity:.85;animation:blink 1.4s ease-in-out infinite;text-shadow:0 3px 0 rgba(0,0,0,.5)}
@keyframes blink{50%{opacity:.35}}
.op .ctr{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:400 22px 'Titan One';opacity:.8}
@media(prefers-reduced-motion:reduce){.op.show .cardw{opacity:1;transform:translate(-50%,-50%)}.op.tear .bagbox{opacity:0}}
</style></head><body>

const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function roll(p){const t0=p.list.reduce((a,b)=>a+b.w,0);let t=Math.random()*t0;for(const b of p.list){if(t<b.w)return b;t-=b.w}return p.list[0]}
let T=[],IV=0,RAF=0;function clr(){T.forEach(clearTimeout);T=[];clearInterval(IV);cancelAnimationFrame(RAF)}
const later=(f,ms)=>T.push(setTimeout(f,ms));
const PURPLE=['#4a1450','#431048','#3a0d3f','#551a5c'];
const PAL={U:['#52d92f','#3cb524','#2a7d1a','#4cc82c'],R:['#2fa8f5','#1f84d6','#165ea3','#2a96e8'],E:['#e8503a','#c0351f','#822214','#d8452e'],L:['#ffbb33','#ff9419','#cc690c','#ffa826'],C:['#2ae0f5','#18b0cf','#0f7f9c','#22c8e0']};
const GAP={U:'#14310d',R:'#0b2742',E:'#3a0e08',L:'#47280a',C:'#06303a'};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shards(cv,cx,cy,pal,count,rainbow){
 const x=cv.getContext('2d'),Q=[];cv.width=innerWidth;cv.height=innerHeight;let f=0;
 const add=n=>{for(let i=0;i<n;i++)Q.push({x:cx+(Math.random()-.5)*200,y:cy-10,vx:(Math.random()-.5)*15,vy:-(6+Math.random()*14),r:Math.random()*6.28,vr:(Math.random()-.5)*.35,s:12+Math.random()*16,c:rainbow?`hsl(${Math.random()*360},85%,55%)`:rnd(pal)})};
 add(count);
 const loop=()=>{x.clearRect(0,0,cv.width,cv.height);if(f++<70)add(Math.ceil(count/60));
  for(const q of Q){q.vy+=.34;q.x+=q.vx;q.y+=q.vy;q.vx*=.992;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.beginPath();x.moveTo(0,-q.s/2);x.lineTo(q.s/2,q.s/2);x.lineTo(-q.s/2,q.s/2);x.closePath();x.fillStyle=q.c;x.fill();x.lineWidth=2.5;x.strokeStyle='rgba(0,0,0,.45)';x.stroke();x.restore()}
  for(let i=Q.length-1;i>=0;i--)if(Q[i].y>cv.height+40)Q.splice(i,1);
  if(Q.length||f<70)RAF=requestAnimationFrame(loop);else x.clearRect(0,0,cv.width,cv.height)};
 loop();
}
function openPack(p,n){

}
// Sequence from the recording: white flash -> dark purple tile grid, pack fades in and waits ->
// click: top strip tears off, tiles wipe left-to-right into the rarity colour, pack drops away ->
// blook card pops in, triangle shards burst up and fall -> click to continue / return to market.
// Rarer pulls get extra build-up (pack shakes, tiles flicker) before the tear and more shards (my approximation).
function play(p,pulls,i){
 clr();const {g}=pulls[i],r=rar(g.k),ri=R.findIndex(x=>x.k===g.k),ov=$('#ov'),st=$('#stage'),k=reduced()?0:1,last=i+1>=pulls.length;
 ov.classList.add('on');ov.style.background='#1f0624';
 st.className='op'+(ri>=3?' rays':'');st.style.cssText='';st.onkeydown=null;
 const cols=Math.max(6,Math.round(innerWidth/130)),w=innerWidth/cols,N=cols*(Math.ceil(innerHeight/w)+1);
 let tl='';for(let j=0;j<N;j++)tl+=`<i class="tl" style="background:${rnd(PURPLE)}"></i>`;
 st.innerHTML=`<div class="grid2" style="grid-template-columns:repeat(${cols},1fr);grid-auto-rows:${w}px">${tl}</div><span class="corner2">${img(p.id+'-icon')}</span><div class="bagbox"><span class="bgi" style="--bag:${p.bag}">${img(p.code)}<b>${p.n} Pack</b><i class="strip"></i><i class="glow"></i></span></div><div class="rays2"></div><div class="cardw" id="cw"><div class="cd" style="--pb:${p.bg}"><div class="ct"><div class="cn">${g.n}</div><div class="cr" style="color:${r.c}">${r.n}</div></div>${bimg(g)}<div class="cp">${fmt(g.w)}</div></div></div><canvas id="cv"></canvas><div class="hint" id="hint">Click to open</div>${pulls.length>1?`<div class="ctr">${i+1} / ${pulls.length}</div>`:''}`;
 const flash=()=>{const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
 if(i===0&&k)flash();
 const g2=st.querySelector('.grid2'),tls=[...g2.children],hint=$('#hint'),pal=PAL[g.k];
 let phase=0,wiped=false,shown=false;
 const wipe=()=>{if(wiped)return;wiped=true;clearInterval(IV);g2.style.setProperty('--gap',GAP[g.k]);if(g.k==='C')g2.classList.add('ch');
  tls.forEach((t,j)=>{t.style.transitionDelay=((j%cols)*38+Math.random()*90)*k+'ms';t.style.background=rnd(pal)});
  later(()=>tls.forEach(t=>t.style.transitionDelay='0ms'),(cols*38+400)*k);
  IV=setInterval(()=>{for(let q=0;q<5;q++)rnd(tls).style.background=rnd(pal);if(Math.random()<.12){const t=rnd(tls);t.style.background=rnd(PURPLE);later(()=>t.style.background=rnd(pal),1600)}},230)};
 const fire=()=>{if(shown)return;shown=true;st.classList.add('show');$('#live').textContent=`You got ${g.n}, ${r.n}`;
  if(ri>=2)flash();if(!k)return;const cw=Math.min(Math.max(220,innerWidth*.3),470);
  shards($('#cv'),innerWidth/2,innerHeight/2+cw/2,pal,Math.round(70*[1,1.3,1.8,2.6,3.2][ri]),g.k==='C')};
 const settle=()=>{T.forEach(clearTimeout);T=[];clearInterval(IV);st.classList.add('tear');wipe();fire();phase=2;hint.textContent='Click anywhere to continue'};
 const go=()=>{phase=1;hint.textContent='';const pre=[0,350,800,1400,1900][ri]*k;
  if(pre){st.classList.add('shake');IV=setInterval(()=>{for(let q=0;q<8;q++)rnd(tls).style.background=rnd(['#7a2a85','#8d3a98',...PURPLE])},120)}
  later(()=>{clearInterval(IV);st.classList.add('tear')},pre);
  later(wipe,pre+90*k);later(fire,pre+520*k);
  later(()=>{phase=2;hint.textContent='Click anywhere to continue'},pre+(1300+ri*300)*k)};
 st.onclick=()=>{if(phase===0)go();else if(phase===1)settle();else if(!last)play(p,pulls,i+1);else close()};
 st.setAttribute('tabindex','0');st.focus();st.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();st.onclick()}};
}
