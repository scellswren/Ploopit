<style>

 requestAnimationFrame(()=>requestAnimationFrame(()=>st.querySelectorAll('.bi img').forEach(centerBlookArt)));
 const flash=()=>{const f=$('#flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
 if(i===0)flash();
 const g2=st.querySelector('.grid2'),tls=[...g2.children],hint=$('#hint');
 let phase=0,shown=false;
 const progression=R.slice(0,ri+1);
 const flashStep=step=>{
  const code=step.k;
  g2.style.setProperty('--gap',GAP[code]);
  g2.classList.toggle('ch',code==='C');
  tls.forEach((t,j)=>{
   t.style.transitionDelay=`${(j%cols)*22+Math.random()*65}ms`;
   t.style.background=rnd(PAL[code]);
  });
 };
 const showCard=()=>{
  if(shown)return;shown=true;
  clearInterval(IV);
  const finalStep=progression[progression.length-1];
  flashStep(finalStep);
  st.classList.add('tear');
  later(()=>{
   st.classList.add('show');
   $('#live').textContent=`You got ${g.n}, ${r.n}`;
   if(ri>=2)flash();
   gemBurst(st);
  },420);
  // Keep the result on screen until its reveal motion has finished.
  later(()=>{phase=2;revealLocked=false;hint.textContent='Click anywhere to continue';hint.classList.add('waiting')},1550);
 };
 const startAnimation=()=>{
  if(phase!==0)return;
  phase=1;
  hint.textContent=fresh?'Opening...':'Click to skip';
  if(fresh)hint.classList.add('waiting');
  progression.forEach((step,index)=>later(()=>flashStep(step),index*560));
  later(showCard,progression.length*560+80);
 };
 const skipDuplicate=()=>{
  if(phase!==1||fresh||shown)return;
  T.forEach(clearTimeout);T=[];clearInterval(IV);
  showCard();
 };
 st.onclick=()=>{
  if(phase===0){startAnimation();return}
  if(phase===1){if(!fresh)skipDuplicate();return}
  if(phase===2){if(!last)play(p,pulls,i+1);else close()}
 };
 st.setAttribute('tabindex','0');st.focus();
 st.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();st.onclick()}};
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!revealLocked)close()});
setTab('shop');
</script></body></html>
